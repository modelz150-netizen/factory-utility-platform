<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Framework Demo</title>
  <link rel="stylesheet" href="../../../assets/design-system/css/index.css">
  <link rel="stylesheet" href="../../../assets/dashboard-framework/css/framework.css">
  <script src="fixture.js" defer></script>
</head>
<body>
  <a class="fup-skip-link" href="#main">Skip to main content</a>
  <div class="fup-shell">
    <header class="fup-shell__header fup-dashboard-shell__header">
      <div class="fup-dashboard-shell__brand"><strong data-i18n="shell.brand"></strong><div class="fup-hint" data-i18n="shell.demo"></div></div>
      <div class="fup-locale-selector" role="group" data-i18n-aria="shell.language">
        <button type="button" data-locale="ko-KR">한국어</button><button type="button" data-locale="vi-VN">Tiếng Việt</button><button type="button" data-locale="en-US">English</button>
      </div>
    </header>
    <nav class="fup-shell__nav fup-dashboard-nav" data-i18n-aria="nav.primary">
      <a href="#main" aria-current="page" data-i18n="nav.home"></a><a href="#engineering" data-i18n="nav.engineering"></a><a href="#operations" data-i18n="nav.operations"></a><a href="#reports" data-i18n="nav.reports"></a>
    </nav>
    <main class="fup-shell__main fup-stack" id="main" tabindex="-1">
      <div><h1 data-i18n="page.title"></h1><p data-i18n="page.description"></p></div>
      <div class="fup-dashboard-regions">
        <section class="fup-dashboard-region fup-dashboard-region--primary fup-panel fup-widget fup-stack" data-state="simulated" aria-labelledby="status-title"><h2 id="status-title" data-i18n="widget.status"></h2><div class="fup-cluster"><span class="fup-status" data-status="simulated" data-i18n="state.simulated"></span><span class="fup-status" data-status="stale" data-i18n="state.stale"></span><span class="fup-status" data-status="unavailable" data-i18n="state.unavailable"></span></div></section>
        <section class="fup-dashboard-region fup-panel fup-widget fup-stack" data-state="simulated" aria-labelledby="sample-title"><h2 id="sample-title" data-i18n="widget.sample"></h2><p><span data-i18n="label.value"></span>: <strong class="fup-data">12.34 demo-units</strong></p><div class="fup-widget__meta"><span class="fup-status" data-status="simulated" data-i18n="state.simulated"></span><time datetime="2026-08-09T09:00:00+07:00" data-date></time></div></section>
        <section class="fup-dashboard-region fup-panel fup-widget fup-stack" data-state="stale" aria-labelledby="format-title"><h2 id="format-title" data-i18n="widget.table"></h2><div class="fup-table-wrap" tabindex="0" role="region" data-i18n-aria="widget.table"><table class="fup-table"><caption data-i18n="table.caption"></caption><thead><tr><th scope="col" data-i18n="table.item"></th><th scope="col" data-i18n="table.presentation"></th></tr></thead><tbody><tr><th scope="row" data-i18n="label.number"></th><td class="fup-data" data-number></td></tr><tr><th scope="row" data-i18n="label.date"></th><td data-date></td></tr></tbody></table></div></section>
        <section class="fup-dashboard-region fup-panel fup-widget fup-stack" data-state="error" aria-labelledby="failure-title"><h2 id="failure-title" data-i18n="widget.failure"></h2><div class="fup-status" data-status="critical" role="alert"><span data-i18n="state.error"></span>: <span data-i18n="failure.message"></span></div><p class="fup-hint">Correlation: demo-0001</p></section>
      </div>
    </main>
    <footer class="fup-shell__footer" data-i18n="footer.note"></footer>
  </div>
</body>
</html>
